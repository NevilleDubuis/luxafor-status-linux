# luxafor-status — status configuration
#
# One status per line:   id | color | label
#
#   id     short name used on the command line: luxafor-toggle <id>
#          (lowercase letters, digits, - and _ ; "off" is reserved)
#   color  a color name (red, orange, purple…) or a hex code (#ff8800)
#   label  what you see in menus and notifications (spaces allowed)
#
# Statuses are cycled in the order below, then "off".
# Add, remove or reorder lines as you like — changes are picked up
# automatically by the tray icon (or run: luxafor-toggle --reload).

available | green   | Available
busy      | red     | Busy
call      | yellow  | On a call

# More examples:
# focus   | #0000ff | Focus — do not disturb
# lunch   | orange  | Lunch break
