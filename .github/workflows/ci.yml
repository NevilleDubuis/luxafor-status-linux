name: CI

on:
  push:
    branches: [main, "v2/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # 22.04: the package then works on Ubuntu 22.04 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev \
            shellcheck lintian appstream desktop-file-utils gettext \
            xvfb dbus xdotool imagemagick libgl1-mesa-dri libxkbcommon-x11-0

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Unit tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Command-line tests (v1 test suite)
        run: tests/run.sh target/release/luxafor-status

      - name: Tray and panel tests (virtual display)
        run: xvfb-run -a -s "-screen 0 1000x760x24" dbus-run-session -- tests/ui.sh target/release/luxafor-status --screenshots shots

      - name: Translations up to date
        run: |
          po/update-pot.sh
          git diff --exit-code po/ || { echo "::error::Run po/update-pot.sh and commit the result"; exit 1; }
          msgfmt --check -o /dev/null po/*.po

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh packaging/*.sh tests/*.sh po/*.sh

      - name: Build .deb
        run: packaging/build-deb.sh "0.0.0~ci${GITHUB_RUN_NUMBER}"

      - name: Lintian
        run: lintian --pedantic --fail-on error,warning dist/*.deb

      - name: AppStream
        run: appstreamcli validate --no-net packaging/*.metainfo.xml

      - name: Install the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          luxafor-toggle --list
          sudo apt-get purge -y luxafor-status

      - uses: actions/upload-artifact@v6
        with:
          name: luxafor-status-deb
          path: dist/*.deb

      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: shots/*.png

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - uses: actions/upload-artifact@v6
        with:
          name: luxafor-status-windows
          path: target/release/luxafor-status.exe
