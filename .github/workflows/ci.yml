name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck lintian appstream desktop-file-utils gettext locales \
            python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 \
            xvfb dbus librsvg2-common
          sudo locale-gen fr_CH.UTF-8   # translation tests

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh bin/luxafor-light bin/luxafor-toggle bin/luxafor-callwatch packaging/build-deb.sh tests/run.sh po/*.sh

      - name: Translations up to date
        run: |
          po/update-pot.sh
          git diff --exit-code -I POT-Creation-Date po/ || { echo "::error::Run po/update-pot.sh and commit the result"; exit 1; }
          msgfmt --check -o /dev/null po/*.po

      - name: Python
        run: |
          python3 -m py_compile bin/luxafor-tray bin/luxafor-panel tests/ui.py
          # Load the tray with the real GTK / AppIndicator bindings (no main loop).
          /usr/bin/python3 - <<'EOF'
          src = open("bin/luxafor-tray").read().replace('if __name__ == "__main__":', "if False:")
          exec(compile(src, "luxafor-tray", "exec"), {"__file__": "bin/luxafor-tray", "__name__": "tray"})
          EOF

      - name: Tests
        run: tests/run.sh

      - name: UI tests (panel and tray, virtual display)
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/ui.py --screenshot panel.png

      - name: Build .deb
        run: packaging/build-deb.sh "0.0.0~ci${GITHUB_RUN_NUMBER}"

      - name: Lintian
        run: lintian --pedantic --fail-on error,warning dist/*.deb

      - name: AppStream
        run: appstreamcli validate --no-net packaging/*.metainfo.xml

      - name: Install the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          luxafor-toggle --list
          sudo apt-get purge -y luxafor-status

      - uses: actions/upload-artifact@v4
        with:
          name: luxafor-status-deb
          path: dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: panel-screenshot
          path: panel.png
