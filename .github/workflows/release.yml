name: Release

# Push a version tag to publish a release with the packages attached:
#   git tag v2.0.0 && git push origin v2.0.0
# A tag with a suffix (v2.0.0-beta.1, v2.0.0-rc.1) is published as a
# pre-release; its package version is 2.0.0~beta.1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # luxafor-status --version
  LUXAFOR_VERSION: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version: use vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi

  deb:
    needs: check
    strategy:
      matrix:
        # 22.04: the packages then work on Ubuntu 22.04 and later.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev lintian desktop-file-utils

      - name: Build
        run: cargo build --release

      - name: Tests
        run: |
          cargo test --release
          tests/run.sh target/release/luxafor-status

      - name: Build .deb
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Lintian
        run: lintian --pedantic --fail-on error,warning dist/*.deb

      - name: Install the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          luxafor-toggle --list

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.os }}
          path: dist/*.deb

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: cargo build --release

      - name: Tests
        run: cargo test --release

      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/luxafor-status.exe "dist/luxafor-status-${GITHUB_REF_NAME#v}-windows-x64.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*.exe

  publish:
    needs: [deb, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes "${PRERELEASE[@]}"

      - name: Update the apt repository (GitHub Pages)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::notice::APT_SIGNING_KEY is not set: the apt repository was not updated (see CONTRIBUTING.md)"
            exit 0
          fi
          sudo apt-get install -y -qq apt-utils
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" repo
          else
            git init --quiet -b gh-pages repo
            git -C repo remote add origin "$url"
          fi
          packaging/update-apt-repo.sh repo dist/*.deb
          cd repo
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "luxafor-status ${GITHUB_REF_NAME#v}"
          git push --quiet origin gh-pages
