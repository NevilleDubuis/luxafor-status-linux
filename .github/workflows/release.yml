name: Release

# Push a version tag to publish a release with the .deb attached:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix (v0.3.0-beta.1, v0.3.0-rc.1) is published as a
# pre-release; its package version is 0.3.0~beta.1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version: use vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian desktop-file-utils gettext

      - name: Tests
        run: tests/run.sh

      - name: Build .deb
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Lintian
        run: lintian --pedantic --fail-on error,warning dist/*.deb

      - name: Install the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          luxafor-toggle --list

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "$GITHUB_REF_NAME" \
            --generate-notes "${PRERELEASE[@]}"

      - name: Update the apt repository (GitHub Pages)
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::notice::APT_SIGNING_KEY is not set: the apt repository was not updated (see CONTRIBUTING.md)"
            exit 0
          fi
          sudo apt-get install -y -qq apt-utils
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "$APT_SIGNING_KEY" | gpg --batch --quiet --import
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$url" repo
          else
            git init --quiet -b gh-pages repo
            git -C repo remote add origin "$url"
          fi
          packaging/update-apt-repo.sh repo dist/*.deb
          cd repo
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "luxafor-status ${GITHUB_REF_NAME#v}"
          git push --quiet origin gh-pages
