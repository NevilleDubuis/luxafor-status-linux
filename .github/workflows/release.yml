name: Release

# Push a version tag to publish a release with the .deb attached:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix (v0.3.0-beta.1, v0.3.0-rc.1) is published as a
# pre-release; its package version is 0.3.0~beta.1.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version: use vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian desktop-file-utils gettext

      - name: Tests
        run: tests/run.sh

      - name: Build .deb
        run: packaging/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Lintian
        run: lintian --pedantic --fail-on error,warning dist/*.deb

      - name: Install the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          luxafor-toggle --list

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --title "$GITHUB_REF_NAME" \
            --generate-notes "${PRERELEASE[@]}"
