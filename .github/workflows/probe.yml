name: v2 probe

# Builds the v2 probe (probe/) for Linux and Windows, and publishes both
# under the "probe" pre-release, so testers just download a file.
on:
  push:
    branches: ["v2/**"]
    paths: ["probe/**", ".github/workflows/probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            file: luxafor-probe
            asset: luxafor-probe-linux-x86_64
          - os: windows-latest
            file: luxafor-probe.exe
            asset: luxafor-probe-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev libudev-dev

      - name: Build
        working-directory: probe
        run: cargo build --release

      - name: Rename
        shell: bash
        run: cp "probe/target/release/${{ matrix.file }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Publish the "probe" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x luxafor-probe-linux-x86_64
          if ! gh release view probe >/dev/null 2>&1; then
            gh release create probe --prerelease --target "$GITHUB_SHA" --title "v2 probe (test build)" \
              --notes "Test build for the v2 rewrite (#11) — not the app. Download the file for your system, run it, follow the steps in its window and paste the report in #11."
          fi
          gh release upload probe luxafor-probe-linux-x86_64 luxafor-probe-windows.exe --clobber
